services:
  # Backend — FastAPI, in-memory/Redis-fallback storage (no persistent DB attached).
  - type: web
    name: carecrew-backend
    runtime: python
    rootDir: cure-crew/backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # Frontend — static HTML/CSS/JS. buildCommand regenerates js/config.js from
  # the API_BASE env var, so the backend URL never needs to be hand-edited
  # into a committed file.
  - type: web
    name: carecrew-frontend
    runtime: static
    rootDir: cure-crew/frontend
    buildCommand: echo "window.CARECREW_API_BASE = \"$API_BASE\";" > js/config.js
    staticPublishPath: .
    envVars:
      - key: API_BASE
        sync: false
